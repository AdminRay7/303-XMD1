<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Analytics | 303-XMD</title>
<meta name="theme-color" content="#00d4ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body.theme-analytics{
    --g1:#00d4ff;
    --g2:#7b2ff7;
    --glow:rgba(0,212,255,.4);
}
.chart-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
}
.chart-card::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:80px; height:3px;
    background:linear-gradient(90deg,var(--g1),var(--g2));
    border-radius:0 0 3px 0;
    box-shadow:0 0 20px var(--glow);
}
.chart-card h3{
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
}
.chart-card h3 i{
    color:var(--g1);
    filter:drop-shadow(0 0 8px var(--glow));
}
.chart-wrap{
    position:relative;
    height:280px;
}
.top-command{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    border-radius:10px;
    background:rgba(255,255,255,.03);
    margin-bottom:6px;
    font-size:12.5px;
}
.top-command .name{ color:var(--g1); font-weight:700; font-family:'Courier New',monospace; }
.top-command .count{ color:var(--text); font-weight:700; }
.top-command .err{ color:#ff5252; font-size:11px; margin-left:8px; }
.error-row{
    background:rgba(255,82,82,.06);
    border-left:3px solid #ff5252;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:8px;
    font-size:11.5px;
    font-family:'Courier New',monospace;
}
.error-row .cmd{ color:#ff9999; font-weight:700; }
.error-row .msg{ color:#b8c4cf; margin-top:4px; }
.error-row .time{ color:var(--muted); font-size:10px; margin-top:4px; }
</style>
</head>
<body class="theme-analytics">

<div id="appSidebarMount"></div>

<main class="app-content">
    <div class="page-head">
        <div>
            <h2>Analytics</h2>
            <div class="sub">Command usage · Traffic · Errors</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="refreshBtn"><i class="fas fa-rotate"></i> Refresh</button>
    </div>

    <div class="chart-card">
        <h3><i class="fas fa-chart-line"></i> Hourly Volume (last 24h)</h3>
        <div class="chart-wrap"><canvas id="hourlyChart"></canvas></div>
    </div>

    <div class="chart-card">
        <h3><i class="fas fa-fire"></i> Top Commands (last 7 days)</h3>
        <div id="topCommands">
            <div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div>
        </div>
    </div>

    <div class="chart-card">
        <h3><i class="fas fa-triangle-exclamation"></i> Recent Errors</h3>
        <div id="errorsList">
            <div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</div>
        </div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script src="/sidebar.js"></script>
<script>
const ADMIN_EMAIL = 'ryanobanga243@gmail.com';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!token) location.href = '/login';

const email = (user.email || '').trim().toLowerCase();
if (email !== ADMIN_EMAIL.toLowerCase()) {
    document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif"><h2>ACCESS DENIED</h2></div>`;
    throw new Error('Not admin');
}

let hourlyChart = null;

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadHourly() {
    try {
        const r = await fetch('/api/admin/analytics/hourly?hours=24', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const d = await r.json();
        const rows = d.hours || [];

        const labels = rows.map(x => x._id.slice(-5));
        const values = rows.map(x => x.count);

        const ctx = document.getElementById('hourlyChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 280);
        gradient.addColorStop(0, 'rgba(0,212,255,.7)');
        gradient.addColorStop(1, 'rgba(0,212,255,.02)');

        if (hourlyChart) hourlyChart.destroy();
        hourlyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: 'Messages',
                    data: values,
                    borderColor: '#00d4ff',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    tension: 0.35,
                    fill: true,
                    pointRadius: 3,
                    pointBackgroundColor: '#00d4ff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: '#5f7f8f', font: { size: 10 } } },
                    y: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: '#5f7f8f', font: { size: 10 } }, beginAtZero: true }
                }
            }
        });
    } catch (e) { console.error(e); }
}

async function loadTopCommands() {
    const box = document.getElementById('topCommands');
    try {
        const r = await fetch('/api/admin/analytics/top-commands?days=7', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const d = await r.json();
        const rows = d.commands || [];

        if (!rows.length) {
            box.innerHTML = '<div class="empty">No data yet</div>';
            return;
        }

        box.innerHTML = rows.map(c => `
            <div class="top-command">
                <span class="name">.${escapeHtml(c._id)}</span>
                <span>
                    <span class="count">${c.count}</span>
                    ${c.errors ? `<span class="err">${c.errors} err</span>` : ''}
                </span>
            </div>
        `).join('');
    } catch (e) {
        box.innerHTML = `<div class="empty">❌ ${escapeHtml(e.message)}</div>`;
    }
}

async function loadErrors() {
    const box = document.getElementById('errorsList');
    try {
        const r = await fetch('/api/admin/analytics/errors', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const d = await r.json();
        const rows = d.errors || [];

        if (!rows.length) {
            box.innerHTML = '<div class="empty">No errors 🎉</div>';
            return;
        }

        box.innerHTML = rows.slice(0, 20).map(e => `
            <div class="error-row">
                <div class="cmd">.${escapeHtml(e.command || 'unknown')}</div>
                <div class="msg">${escapeHtml(e.errorMsg || '—')}</div>
                <div class="time">${new Date(e.timestamp).toLocaleString()}</div>
            </div>
        `).join('');
    } catch (e) {
        box.innerHTML = `<div class="empty">❌ ${escapeHtml(e.message)}</div>`;
    }
}

document.getElementById('refreshBtn').onclick = () => {
    loadHourly();
    loadTopCommands();
    loadErrors();
};

loadHourly();
loadTopCommands();
loadErrors();
setInterval(loadHourly, 30000);
</script>
</body>
</html>
