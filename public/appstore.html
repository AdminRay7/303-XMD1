<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App Store | 303-XMD</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    body.theme-store { background: #09090b; --g1: #00e5a0; --g2: #00b87a; }
    
    .hero-banner {
        background: linear-gradient(135deg, rgba(0,229,160,0.05) 0%, rgba(123,47,247,0.05) 100%);
        border: 1px solid rgba(0,229,160,0.2);
        border-radius: 20px;
        padding: 24px;
        margin-bottom: 20px;
    }
    .hero-badge { background: rgba(0,229,160,0.1); color: #00e5a0; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; letter-spacing: 1px; display: inline-block; margin-bottom: 10px;}
    .hero-banner h1 { color: #fff; font-size: 26px; margin: 0 0 8px 0; }
    .hero-banner p { color: #a1a1aa; font-size: 13px; margin-bottom: 16px; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-pay { background: #00e5a0; color: #000; font-weight: bold; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-size:13px;}
    .btn-paystack { background: transparent; border: 1px solid #00e5a0; color: #00e5a0; font-weight: bold; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size:13px;}
    
    .search-bar { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .search-bar input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; }
    
    .cat-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .cat-tab { background: #18181b; border: 1px solid #27272a; color: #a1a1aa; padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .cat-tab.active { background: rgba(0,229,160,0.1); border-color: #00e5a0; color: #00e5a0; font-weight: bold; }
    
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .app-card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 16px; text-align: center; transition: 0.2s; }
    .app-card:hover { border-color: #00e5a0; transform: translateY(-3px); }
    
    .app-icon { width: 60px; height: 60px; background: #27272a; border-radius: 12px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #00e5a0; }
    .app-name { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-desc { color: #a1a1aa; font-size: 11px; margin-bottom: 12px; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .app-price { background: rgba(0,229,160,0.1); color: #00e5a0; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; display: inline-block; }
</style>
</head>
<body class="theme-store">
<div id="appSidebarMount"></div>

<main class="app-content">
    <div class="hero-banner">
        <div class="hero-badge">● LIVE STORE</div>
        <h1>Discover Premium Apps</h1>
        <p>Purchase with Coins or Paystack. Download instantly after payment.</p>
        <div class="btn-group">
            <button class="btn-pay" onclick="window.location.href='/store'"><i class="fas fa-coins"></i> Pay with Balance</button>
            <button class="btn-paystack" onclick="window.location.href='/store'"><i class="fas fa-credit-card"></i> Paystack</button>
        </div>
    </div>

    <div class="search-bar">
        <i class="fas fa-search" style="color:#52525b;"></i>
        <input type="text" id="searchInput" placeholder="Search apps...">
    </div>

    <div class="cat-tabs" id="catTabs">
        <div class="cat-tab active" data-cat="All">All</div>
        <div class="cat-tab" data-cat="Tools">Tools</div>
        <div class="cat-tab" data-cat="Games">Games</div>
        <div class="cat-tab" data-cat="Social">Social</div>
        <div class="cat-tab" data-cat="Utility">Utility</div>
    </div>

    <div class="app-grid" id="appGrid">
        <div class="empty" style="grid-column: 1/-1;"><i class="fas fa-spinner fa-spin"></i> Loading apps...</div>
    </div>
</main>

<script src="/sidebar.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/login';

let allApps = [];
let currentCategory = 'All';

async function loadApps() {
    const grid = document.getElementById('appGrid');
    try {
        const r = await fetch('/api/store/apps', { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        
        if (d.success && d.apps.length > 0) {
            allApps = d.apps;
            renderApps();
        } else {
            grid.innerHTML = '<div class="empty" style="grid-column: 1/-1;">No apps available yet.</div>';
        }
    } catch (e) {
        grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">❌ ${e.message}</div>`;
    }
}

function renderApps() {
    const grid = document.getElementById('appGrid');
    const query = document.getElementById('searchInput').value.toLowerCase();
    
    let filtered = allApps;
    
    // Filter by category
    if (currentCategory !== 'All') {
        filtered = filtered.filter(app => app.category === currentCategory);
    }
    
    // Filter by search
    if (query) {
        filtered = filtered.filter(app => app.name.toLowerCase().includes(query) || app.description.toLowerCase().includes(query));
    }

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column: 1/-1;">No apps found.</div>';
        return;
    }

    grid.innerHTML = filtered.map(app => `
        <div class="app-card">
            <div class="app-icon"><i class="fas ${app.icon}"></i></div>
            <div class="app-name">${app.name}</div>
            <div class="app-desc">${app.description}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <div class="app-price">${app.price === 0 ? 'Free' : app.price + ' 🪙'}</div>
                <div style="font-size:10px; color:#52525b;"><i class="fas fa-download"></i> ${app.downloads}</div>
            </div>
            <button class="btn btn-primary btn-block" style="margin-top:12px; font-size:12px; padding:8px;" onclick="downloadApp('${app._id}', ${app.price})">
                ${app.price === 0 ? 'Install' : 'Buy'}
            </button>
        </div>
    `).join('');
}

async function downloadApp(id, price) {
    if (price > 0 && !confirm(`This app costs ${price} coins. Continue?`)) return;
    
    try {
        const r = await fetch('/api/store/download/' + id, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const d = await r.json();
        
        if (d.success) {
            alert('Download started!');
            // Update local user balance display if needed
            window.location.href = d.url; // Trigger download
            loadApps(); // Refresh count
        } else {
            alert('Purchase failed: ' + d.error);
        }
    } catch (e) { alert('Error: ' + e.message); }
}

// Event Listeners
document.getElementById('searchInput').addEventListener('input', renderApps);

document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.cat;
        renderApps();
    });
});

loadApps();
</script>
</body>
</html>
