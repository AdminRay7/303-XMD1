<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Broadcast | 303-XMD</title>
<meta name="theme-color" content="#ffcc66">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/theme.css">
<style>
body.theme-broadcast{
    --g1:#ffcc66;
    --g2:#d97706;
    --glow:rgba(255,204,102,.4);
    --bg:#1a1200;
    --bg2:#2e2000;
}
.broadcast-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    position:relative;
    overflow:hidden;
}
.broadcast-box::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:80px; height:3px;
    background:linear-gradient(90deg,var(--g1),var(--g2));
    box-shadow:0 0 20px var(--glow);
}
.broadcast-box h3{
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--g1);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
}
.broadcast-box p{
    font-size:12px;
    color:var(--muted);
    margin-bottom:16px;
    line-height:1.6;
}
.broadcast-box label{
    display:block;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
}
.broadcast-box textarea{
    width:100%;
    min-height:140px;
    padding:14px;
    background:rgba(0,0,0,.4);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    font-size:14px;
    font-family:inherit;
    outline:none;
    resize:vertical;
    line-height:1.5;
}
.broadcast-box textarea:focus{ border-color:var(--g1); box-shadow:0 0 20px var(--glow); }
.char-count{
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
    text-align:right;
}
.btn-row{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
    margin-top:16px;
}
.stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;
    margin-top:20px;
}
.stat-card{
    background:rgba(255,204,102,.06);
    border:1px solid rgba(255,204,102,.25);
    border-radius:12px;
    padding:16px;
    text-align:center;
}
.stat-card .num{
    font-size:22px;
    font-weight:800;
    background:linear-gradient(135deg,var(--g1),var(--g2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.stat-card .lbl{
    font-size:10px;
    color:var(--muted);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:6px;
}
</style>
</head>
<body class="theme-broadcast">

<div id="appSidebarMount"></div>

<main class="app-content">
    <div class="page-head">
        <div>
            <h2>Broadcast</h2>
            <div class="sub">Send a message to every connected session</div>
        </div>
    </div>

    <div class="broadcast-box">
        <h3><i class="fas fa-bullhorn"></i> Compose Broadcast</h3>
        <p>Sends to <b>every connected session's own WhatsApp number</b>. Each session receives its own copy.</p>

        <label>Message</label>
        <textarea id="broadcastText" placeholder="Type your announcement…"></textarea>
        <div class="char-count" id="charCount">0 characters</div>

        <div class="btn-row">
            <button class="btn btn-primary" id="sendBtn"><i class="fas fa-paper-plane"></i> Send Broadcast</button>
            <button class="btn btn-ghost" id="clearBtn"><i class="fas fa-eraser"></i> Clear</button>
        </div>

        <div class="error" id="err"></div>
        <div class="ok" id="ok"></div>

        <div class="stat-row" id="statsRow" style="display:none">
            <div class="stat-card"><div class="num" id="statSent">0</div><div class="lbl">Sent</div></div>
            <div class="stat-card"><div class="num" id="statFailed">0</div><div class="lbl">Failed</div></div>
            <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
        </div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script src="/sidebar.js"></script>
<script>
const ADMIN_EMAIL = 'ryanobanga243@gmail.com';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!token) location.href = '/login';
const email = (user.email || '').trim().toLowerCase();
if (email !== ADMIN_EMAIL.toLowerCase()) {
    document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif"><h2>ACCESS DENIED</h2></div>`;
    throw new Error('Not admin');
}

const textarea = document.getElementById('broadcastText');
const charCount = document.getElementById('charCount');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const errBox = document.getElementById('err');
const okBox = document.getElementById('ok');
const statsRow = document.getElementById('statsRow');
const toastEl = document.getElementById('toast');

function toast(msg, err = false) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', err);
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2200);
}

textarea.addEventListener('input', () => {
    charCount.textContent = `${textarea.value.length} characters`;
});

sendBtn.onclick = async () => {
    errBox.classList.remove('show');
    okBox.classList.remove('show');
    statsRow.style.display = 'none';

    const text = textarea.value.trim();
    if (!text) {
        errBox.innerText = 'Enter a message';
        errBox.classList.add('show');
        return;
    }

    if (!confirm(`Send to ALL connected sessions?\n\n${text.slice(0, 150)}${text.length > 150 ? '…' : ''}`)) return;

    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';

    try {
        const r = await fetch('/api/admin/broadcast', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Failed');

        document.getElementById('statSent').textContent = d.sent || 0;
        document.getElementById('statFailed').textContent = d.failed || 0;
        document.getElementById('statTotal').textContent = (d.sent || 0) + (d.failed || 0);
        statsRow.style.display = 'grid';

        okBox.innerText = `✅ Broadcast complete — ${d.sent} sent, ${d.failed} failed`;
        okBox.classList.add('show');
        toast('Broadcast sent!');
    } catch (e) {
        errBox.innerText = e.message;
        errBox.classList.add('show');
        toast(e.message, true);
    }

    sendBtn.disabled = false;
    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Broadcast';
};

clearBtn.onclick = () => {
    textarea.value = '';
    charCount.textContent = '0 characters';
    errBox.classList.remove('show');
    okBox.classList.remove('show');
    statsRow.style.display = 'none';
};
</script>
</body>
</html>
