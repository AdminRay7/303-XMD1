<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Settings | 303-XMD</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="theme-settings">
<div id="appSidebarMount"></div>

<main class="app-content">
    <div class="page-head">
        <div>
            <h2>Bot Settings</h2>
            <div class="sub">Configure your bot's identity</div>
        </div>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-head">
            <div class="card-head-icon"><i class="fas fa-sliders"></i></div>
            <div><h3>Identity Settings</h3><p>Change how your bot looks</p></div>
        </div>

        <div class="form-group" id="loading" style="text-align:center; padding: 20px;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Loading your sessions...</p>
        </div>

        <div id="settingsForm" style="display:none;">
            <div class="form-group">
                <label>Select Session</label>
                <select id="sessionSelect" class="input" onchange="loadSpecificSettings()"></select>
            </div>
            
            <hr style="border-color: var(--border); margin: 20px 0;">

            <div class="form-group">
                <label>Bot Name</label>
                <input type="text" id="botName" class="input" placeholder="e.g. My Shop Bot">
            </div>

            <div class="form-group">
                <label>Command Prefix</label>
                <input type="text" id="prefix" class="input" placeholder="e.g. ." maxlength="3">
            </div>

            <div class="form-group">
                <label>Footer Text</label>
                <input type="text" id="footer" class="input" placeholder="e.g. Powered by Me">
            </div>

            <button class="btn btn-primary btn-block" id="saveBtn" style="margin-top: 20px;">
                <i class="fas fa-save"></i> Save Settings
            </button>
        </div>
    </div>
</main>

<script src="/sidebar.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/login';

let currentSessionId = null;
let allSettings = {}; // Store settings per session ID

// 1. Load user's sessions
async function init() {
    try {
        const r = await fetch('/api/user/sessions', { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        
        if (d.success && d.sessions.length > 0) {
            const select = document.getElementById('sessionSelect');
            select.innerHTML = d.sessions.map(s => `<option value="${s.sessionId}">+${s.phone || s.sessionId}</option>`).join('');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('settingsForm').style.display = 'block';
            
            // Load settings for the first session
            await loadSpecificSettings();
        } else {
            document.getElementById('loading').innerHTML = '<p>No sessions found. Pair a bot first.</p>';
        }
    } catch (e) {
        document.getElementById('loading').innerHTML = `<p>Error: ${e.message}</p>`;
    }
}

// 2. Load settings for the selected session
async function loadSpecificSettings() {
    const sessionId = document.getElementById('sessionSelect').value;
    currentSessionId = sessionId;
    
    try {
        const r = await fetch('/api/settings/' + sessionId, { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await r.json();
        
        if (d.success) {
            document.getElementById('botName').value = d.settings.botName || '303-XMD';
            document.getElementById('prefix').value = d.settings.prefix || '.';
            document.getElementById('footer').value = d.settings.footer || 'The Last Key';
        }
    } catch (e) { console.error('Failed to load settings:', e); }
}

// 3. Save settings
document.getElementById('saveBtn').onclick = async () => {
    if (!currentSessionId) return alert('No session selected.');

    const btn = document.getElementById('saveBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
        const r = await fetch('/api/settings/' + currentSessionId, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                botName: document.getElementById('botName').value,
                prefix: document.getElementById('prefix').value,
                footer: document.getElementById('footer').value
            })
        });
        const d = await r.json();
        
        if (d.success) {
            alert('Settings saved successfully! The bot will use these immediately.');
        } else {
            alert('Failed: ' + d.error);
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
    btn.innerHTML = '<i class="fas fa-save"></i> Save Settings';
};

init();
</script>
</body>
</html>
