<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | 303-XMD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body class="theme-register auth-body">

<div class="auth-card">
    <div class="auth-brand">
        <div class="auth-logo"><i class="fas fa-user-plus"></i></div>
        <h1>303-XMD</h1>
        <p>Create Account</p>
    </div>

    <div class="error" id="err"></div>

    <form id="regForm">
        <label class="field-label">Full Name</label>
        <input class="input" type="text" id="name" placeholder="Your name" autocomplete="name" required>

        <label class="field-label">Email Address</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>

        <label class="field-label">Password</label>
        <input class="input" type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>

        <button type="submit" class="btn btn-primary btn-block" id="regBtn">
            <i class="fas fa-user-plus"></i> Create Account
        </button>
    </form>

    <div class="auth-link">Already have an account? <a href="/login">Login</a></div>
    <div class="auth-footer">DEVELOPED BY <a href="https://wa.me/254794376595">MR PRESENTER</a></div>
</div>

<script>
const form = document.getElementById('regForm');
const errBox = document.getElementById('err');
const regBtn = document.getElementById('regBtn');

form.onsubmit = async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!name || !email || !password) {
        errBox.innerText = 'All fields are required';
        errBox.classList.add('show');
        return;
    }
    if (password.length < 6) {
        errBox.innerText = 'Password must be at least 6 characters';
        errBox.classList.add('show');
        return;
    }
    regBtn.disabled = true;
    regBtn.innerHTML = '<span class="skeleton"></span> CREATING...';
    try {
        const r = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });
        const data = await r.json();
        if (!r.ok || data.error) throw new Error(data.error || 'Registration failed');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = '/dashboard';
    } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.add('show');
        regBtn.disabled = false;
        regBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
    }
};
</script>
</body>
</html>
